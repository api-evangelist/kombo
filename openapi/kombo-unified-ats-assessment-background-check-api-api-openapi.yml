openapi: 3.2.0
info:
  title: Kombo Unified ATS (Assessment & Background Check) API
  version: 1.0.0
  description: Unified endpoints to operate Assessments and Background Checks for many applicant tracking systems.
servers:
- url: https://api.kombo.dev/v1
  description: Kombo EU API
- url: https://api.us.kombo.dev/v1
  description: Kombo US API
- url: https://api.ca.kombo.dev/v1
  description: Kombo CA API
security:
- ApiKey: []
tags:
- name: Unified ATS (Assessment & Background Check) API
  description: Unified endpoints to operate Assessments and Background Checks for many applicant tracking systems.
paths:
  /assessment/packages:
    get:
      operationId: GetAssessmentPackages
      summary: Get packages
      description: 'Get all available assessment and background check packages for an integration.


        This is mainly intended for debugging. As you always need to submit the full list of available packages when using "set packages", there shouldn''t ever be a need to call this endpoint in production.'
      tags:
      - Unified ATS (Assessment & Background Check) API
      parameters:
      - in: header
        name: X-Integration-Id
        schema:
          type: string
        description: ID of the integration you want to interact with.
        example: recruitee:HWUTwvyx2wLoSUHphiWVrp28
        required: true
      responses:
        '200':
          description: GET /assessment/packages Positive response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAssessmentPackagesPositiveResponse'
              examples:
                example1:
                  value:
                    status: success
                    data:
                      packages:
                      - id: '1001'
                        name: TypeScript
                        description: TypeScript coding skills assessments
                        updated_at: '2023-06-29T18:47:40.890Z'
                        type: SKILLS_TEST
        default:
          $ref: '#/components/responses/ErrorResponseATS'
      x-codeSamples:
      - lang: python
        label: GetAssessmentPackages
        source: "from kombo import Kombo\n\n\nwith Kombo(\n    integration_id=\"workday:HWUTwvyx2wLoSUHphiWVrp28\",\n    api_key=\"<YOUR_BEARER_TOKEN_HERE>\",\n) as k_client:\n\n    res = k_client.assessment.get_packages()\n\n    # Handle response\n    print(res)"
      - lang: typescript
        label: GetAssessmentPackages
        source: "import { Kombo } from \"@kombo-api/sdk\";\n\nconst kombo = new Kombo({\n  integration_id: \"workday:HWUTwvyx2wLoSUHphiWVrp28\",\n  api_key: \"<YOUR_BEARER_TOKEN_HERE>\",\n});\n\nasync function run() {\n  const result = await kombo.assessment.getPackages();\n\n  console.log(result);\n}\n\nrun();"
      - lang: ruby
        label: GetAssessmentPackages
        source: "require 'kombo'\n\nModels = ::Kombo::Models\ns = ::Kombo::Kombo.new(\n  integration_id: 'workday:HWUTwvyx2wLoSUHphiWVrp28',\n  security: Models::Shared::Security.new(\n    api_key: '<YOUR_BEARER_TOKEN_HERE>'\n  )\n)\nres = s.assessment.get_packages\n\nunless res.get_assessment_packages_positive_response.nil?\n  # handle response\nend"
    put:
      operationId: PutAssessmentPackages
      summary: Set packages
      description: 'Set packages


        This feature is currently available for the following integrations:


        You''d like to see this feature for another integration? Please reach out!

        We''re always happy to discuss extending our coverage.


        Replaces the list of available assessment and or background check packages.


        Packages that have been previously submitted through this endpoint but aren''t included again will be marked as deleted.


        ### Example Request Body


        ```json

        {

        "packages": [

        {

        "id": "1001",

        "type": "SKILLS_TEST",

        "name": "TypeScript",

        "description": "TypeScript coding skills assessments"

        },

        {

        "id": "1002",

        "type": "VIDEO_INTERVIEW",

        "name": "Video Interview",

        "description": "Video interview to assess communication skills"

        }

        ]

        }

        ```'
      tags:
      - Unified ATS (Assessment & Background Check) API
      parameters:
      - in: header
        name: X-Integration-Id
        schema:
          type: string
        description: ID of the integration you want to interact with.
        example: recruitee:HWUTwvyx2wLoSUHphiWVrp28
        required: true
      requestBody:
        description: PUT /assessment/packages Request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutAssessmentPackagesRequestBody'
            examples:
              example1:
                value:
                  packages:
                  - id: '1001'
                    type: SKILLS_TEST
                    name: TypeScript
                    description: TypeScript coding skills assessments
                  - id: '1002'
                    type: VIDEO_INTERVIEW
                    name: Video Interview
                    description: Video interview to assess communication skills
      responses:
        '200':
          description: PUT /assessment/packages Positive response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutAssessmentPackagesPositiveResponse'
        default:
          $ref: '#/components/responses/ErrorResponseATS'
      x-codeSamples:
      - lang: python
        label: PutAssessmentPackages
        source: "from kombo import Kombo\n\n\nwith Kombo(\n    integration_id=\"workday:HWUTwvyx2wLoSUHphiWVrp28\",\n    api_key=\"<YOUR_BEARER_TOKEN_HERE>\",\n) as k_client:\n\n    res = k_client.assessment.set_packages(packages=[\n        {\n            \"id\": \"1001\",\n            \"type\": \"SKILLS_TEST\",\n            \"name\": \"TypeScript\",\n            \"description\": \"TypeScript coding skills assessments\",\n        },\n        {\n            \"id\": \"1002\",\n            \"type\": \"VIDEO_INTERVIEW\",\n            \"name\": \"Video Interview\",\n            \"description\": \"Video interview to assess communication skills\",\n        },\n    ])\n\n    # Handle response\n    print(res)"
      - lang: typescript
        label: PutAssessmentPackages
        source: "import { Kombo } from \"@kombo-api/sdk\";\n\nconst kombo = new Kombo({\n  integration_id: \"workday:HWUTwvyx2wLoSUHphiWVrp28\",\n  api_key: \"<YOUR_BEARER_TOKEN_HERE>\",\n});\n\nasync function run() {\n  const result = await kombo.assessment.setPackages({\n    packages: [\n      {\n        id: \"1001\",\n        type: \"SKILLS_TEST\",\n        name: \"TypeScript\",\n        description: \"TypeScript coding skills assessments\",\n      },\n      {\n        id: \"1002\",\n        type: \"VIDEO_INTERVIEW\",\n        name: \"Video Interview\",\n        description: \"Video interview to assess communication skills\",\n      },\n    ],\n  });\n\n  console.log(result);\n}\n\nrun();"
      - lang: ruby
        label: PutAssessmentPackages
        source: "require 'kombo'\n\nModels = ::Kombo::Models\ns = ::Kombo::Kombo.new(\n  integration_id: 'workday:HWUTwvyx2wLoSUHphiWVrp28',\n  security: Models::Shared::Security.new(\n    api_key: '<YOUR_BEARER_TOKEN_HERE>'\n  )\n)\nres = s.assessment.set_packages(body: Models::Shared::PutAssessmentPackagesRequestBody.new(\n  packages: [\n    Models::Shared::PutAssessmentPackagesRequestBodyPackage.new(\n      id: '1001',\n      type: Models::Shared::PutAssessmentPackagesRequestBodyType::SKILLS_TEST,\n      name: 'TypeScript',\n      description: 'TypeScript coding skills assessments'\n    ),\n    Models::Shared::PutAssessmentPackagesRequestBodyPackage.new(\n      id: '1002',\n      type: Models::Shared::PutAssessmentPackagesRequestBodyType::VIDEO_INTERVIEW,\n      name: 'Video Interview',\n      description: 'Video interview to assess communication skills'\n    ),\n  ]\n))\n\nunless res.put_assessment_packages_positive_response.nil?\n  # handle response\nend"
  /assessment/orders:
    get:
      operationId: GetAssessmentOrders
      summary: Get orders
      description: Get all assessment and background check orders of an integration.
      tags:
      - Unified ATS (Assessment & Background Check) API
      parameters:
      - in: header
        name: X-Integration-Id
        schema:
          type: string
        description: ID of the integration you want to interact with.
        example: recruitee:HWUTwvyx2wLoSUHphiWVrp28
        required: true
      - name: cursor
        in: query
        required: false
        description: An optional cursor string used for pagination. This can be retrieved from the `next` property of the previous page response.
        schema:
          $ref: '#/components/schemas/GetAssessmentOrdersParameterCursor'
      - name: page_size
        in: query
        required: false
        description: The number of results to return per page. Maximum is 250.
        schema:
          $ref: '#/components/schemas/GetAssessmentOrdersParameterPageSize'
      - name: ids
        in: query
        required: false
        description: Filter by a comma-separated list of IDs such as `222k7eCGyUdgt2JWZDNnkDs3,B5DVmypWENfU6eMe6gYDyJG3`.
        schema:
          $ref: '#/components/schemas/GetAssessmentOrdersParameterIds'
      - name: statuses
        in: query
        required: false
        description: 'Filter by a comma-separated list of `OPEN`, `COMPLETED`, `CANCELLED`, `REJECTED`.


          Leave this blank to get results matching all values.'
        schema:
          $ref: '#/components/schemas/GetAssessmentOrdersParameterStatuses'
      - name: created_after
        in: query
        required: false
        description: 'Filter orders by their creation date-timestamp in the format: `YYYY-MM-DDTHH:mm:ss.sssZ`. Only orders created on or after this date-timestamp will be returned.'
        schema:
          $ref: '#/components/schemas/GetAssessmentOrdersParameterCreatedAfter'
      responses:
        '200':
          description: GET /assessment/orders Positive response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAssessmentOrdersPositiveResponse'
        default:
          $ref: '#/components/responses/ErrorResponseATS'
      x-codeSamples:
      - lang: python
        label: GetAssessmentOrders
        source: "from kombo import Kombo\n\n\nwith Kombo(\n    integration_id=\"workday:HWUTwvyx2wLoSUHphiWVrp28\",\n    api_key=\"<YOUR_BEARER_TOKEN_HERE>\",\n) as k_client:\n\n    res = k_client.assessment.get_assessment_orders(page_size=100)\n\n    while res is not None:\n        # Handle items\n\n        res = res.next()"
      - lang: typescript
        label: GetAssessmentOrders
        source: "import { Kombo } from \"@kombo-api/sdk\";\n\nconst kombo = new Kombo({\n  integration_id: \"workday:HWUTwvyx2wLoSUHphiWVrp28\",\n  api_key: \"<YOUR_BEARER_TOKEN_HERE>\",\n});\n\nasync function run() {\n  const result = await kombo.assessment.getAssessmentOrders({});\n\n  for await (const page of result) {\n    console.log(page);\n  }\n}\n\nrun();"
      - lang: ruby
        label: GetAssessmentOrders
        source: "require 'kombo'\n\nModels = ::Kombo::Models\ns = ::Kombo::Kombo.new(\n  integration_id: 'workday:HWUTwvyx2wLoSUHphiWVrp28',\n  security: Models::Shared::Security.new(\n    api_key: '<YOUR_BEARER_TOKEN_HERE>'\n  )\n)\nres = s.assessment.get_assessment_orders(page_size: 100)\n\nunless res.get_assessment_orders_positive_response.nil?\n  # handle response\nend"
  /assessment/orders/open:
    get:
      operationId: GetAssessmentOrdersOpen
      summary: Get open orders (deprecated)
      description: '**(⚠️ Deprecated - Use Get orders instead)** Get all open assessment and background check orders of an integration.'
      tags:
      - Unified ATS (Assessment & Background Check) API
      parameters:
      - in: header
        name: X-Integration-Id
        schema:
          type: string
        description: ID of the integration you want to interact with.
        example: recruitee:HWUTwvyx2wLoSUHphiWVrp28
        required: true
      - name: cursor
        in: query
        required: false
        description: An optional cursor string used for pagination. This can be retrieved from the `next` property of the previous page response.
        schema:
          $ref: '#/components/schemas/GetAssessmentOrdersOpenParameterCursor'
      - name: page_size
        in: query
        required: false
        description: The number of results to return per page. Maximum is 250.
        schema:
          $ref: '#/components/schemas/GetAssessmentOrdersOpenParameterPageSize'
      responses:
        '200':
          description: GET /assessment/orders/open Positive response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAssessmentOrdersOpenPositiveResponse'
        default:
          $ref: '#/components/responses/ErrorResponseATS'
      deprecated: true
  /assessment/orders/{assessment_order_id}/result:
    put:
      operationId: PutAssessmentOrdersAssessmentOrderIdResult
      summary: Update order result
      description: 'Updates an assessment or a background check order result.


        This feature is currently available for the following integrations:


        Workday


        SAP SuccessFactors


        SmartRecruiters


        Oracle Recruiting Cloud


        Lever


        iCIMS


        Tellent Recruitee


        Greenhouse


        Teamtailor


        Ashby


        UKG Pro


        Bullhorn


        Jobylon


        Eightfold


        Avature


        JazzHR


        Jobvite


        PageUp People


        Workable


        Kombo Sandbox


        You''d like to see this feature for another integration? Please reach out!

        We''re always happy to discuss extending our coverage.


        ### Example Request Body


        ```json

        {

        "status": "COMPLETED",

        "score": 90,

        "max_score": 100,

        "result_url": "https://example.com",

        "completed_at": "2023-04-04T00:00:00.000Z",

        "attributes": [

        {

        "type": "TEXT",

        "label": "Role fit",

        "value": "Excellent"

        },

        {

        "type": "SUB_RESULT",

        "id": "",

        "label": "Personality test",

        "score": {

        "value": 97,

        "max": 100

        },

        "status": "COMPLETED"

        }

        ],

        "attachments": [

        {

        "name": "Assessment Report.pdf",

        "data": "SGkgdGhlcmUsIEtvbWJvIGlzIGN1cnJlbnRseSBoaXJpbmcgZW5naW5lZXJzIHRoYXQgbG92ZSB0byB3b3JrIG9uIGRldmVsb3BlciBwcm9kdWN0cy4=",

        "content_type": "application/pdf"

        }

        ]

        }

        ```'
      tags:
      - Unified ATS (Assessment & Background Check) API
      parameters:
      - in: header
        name: X-Integration-Id
        schema:
          type: string
        description: ID of the integration you want to interact with.
        example: recruitee:HWUTwvyx2wLoSUHphiWVrp28
        required: true
      - name: assessment_order_id
        in: path
        required: true
        description: PUT /assessment/orders/:assessment_order_id/result Parameter
        schema:
          $ref: '#/components/schemas/PutAssessmentOrdersAssessmentOrderIdResultParameterAssessmentOrderId'
        examples:
          example1:
            value: GRKdd9dibYKKCrmGRSMJf3wu
      requestBody:
        description: PUT /assessment/orders/:assessment_order_id/result Request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutAssessmentOrdersAssessmentOrderIdResultRequestBody'
            examples:
              example1:
                value:
                  status: COMPLETED
                  score: 90
                  max_score: 100
                  result_url: https://example.com
                  completed_at: '2023-04-04T00:00:00.000Z'
                  attributes:
                  - type: TEXT
                    label: Role fit
                    value: Excellent
                  - type: SUB_RESULT
                    id: <YOUR_INTERNAL_ID_OF_THE_TEST>
                    label: Personality test
                    score:
                      value: 97
                      max: 100
                    status: COMPLETED
                  attachments:
                  - name: Assessment Report.pdf
                    data: SGkgdGhlcmUsIEtvbWJvIGlzIGN1cnJlbnRseSBoaXJpbmcgZW5naW5lZXJzIHRoYXQgbG92ZSB0byB3b3JrIG9uIGRldmVsb3BlciBwcm9kdWN0cy4=
                    content_type: application/pdf
      responses:
        '200':
          description: PUT /assessment/orders/:assessment_order_id/result Positive response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutAssessmentOrdersAssessmentOrderIdResultPositiveResponse'
        default:
          $ref: '#/components/responses/ErrorResponseATS'
      x-codeSamples:
      - lang: python
        label: PutAssessmentOrdersAssessmentOrderIdResult
        source: "from kombo import Kombo\nfrom kombo.utils import parse_datetime\n\n\nwith Kombo(\n    integration_id=\"workday:HWUTwvyx2wLoSUHphiWVrp28\",\n    api_key=\"<YOUR_BEARER_TOKEN_HERE>\",\n) as k_client:\n\n    res = k_client.assessment.update_order_result(assessment_order_id=\"GRKdd9dibYKKCrmGRSMJf3wu\", status=\"COMPLETED\", result_url=\"https://example.com\", completed_at=parse_datetime(\"2023-04-04T00:00:00Z\"), score=90.0, max_score=100.0, attributes=[\n        {\n            \"type\": \"TEXT\",\n            \"label\": \"Role fit\",\n            \"value\": \"Excellent\",\n        },\n        {\n            \"type\": \"SUB_RESULT\",\n            \"id\": \"<YOUR_INTERNAL_ID_OF_THE_TEST>\",\n            \"label\": \"Personality test\",\n            \"score\": {\n                \"value\": 97.0,\n                \"max\": 100.0,\n            },\n            \"status\": \"COMPLETED\",\n        },\n    ], attachments=[\n        {\n            \"name\": \"Assessment Report.pdf\",\n            \"content_type\": \"application/pdf\",\n            \"data\": \"SGkgdGhlcmUsIEtvbWJvIGlzIGN1cnJlbnRseSBoaXJpbmcgZW5naW5lZXJzIHRoYXQgbG92ZSB0byB3b3JrIG9uIGRldmVsb3BlciBwcm9kdWN0cy4=\",\n        },\n    ])\n\n    # Handle response\n    print(res)"
      - lang: typescript
        label: PutAssessmentOrdersAssessmentOrderIdResult
        source: "import { Kombo } from \"@kombo-api/sdk\";\n\nconst kombo = new Kombo({\n  integration_id: \"workday:HWUTwvyx2wLoSUHphiWVrp28\",\n  api_key: \"<YOUR_BEARER_TOKEN_HERE>\",\n});\n\nasync function run() {\n  const result = await kombo.assessment.updateOrderResult({\n    assessment_order_id: \"GRKdd9dibYKKCrmGRSMJf3wu\",\n    body: {\n      status: \"COMPLETED\",\n      result_url: \"https://example.com\",\n      completed_at: new Date(\"2023-04-04T00:00:00Z\"),\n      score: 90,\n      max_score: 100,\n      attributes: [\n        {\n          type: \"TEXT\",\n          label: \"Role fit\",\n          value: \"Excellent\",\n        },\n        {\n          type: \"SUB_RESULT\",\n          id: \"<YOUR_INTERNAL_ID_OF_THE_TEST>\",\n          label: \"Personality test\",\n          score: {\n            value: 97,\n            max: 100,\n          },\n          status: \"COMPLETED\",\n        },\n      ],\n      attachments: [\n        {\n          name: \"Assessment Report.pdf\",\n          content_type: \"application/pdf\",\n          data: \"SGkgdGhlcmUsIEtvbWJvIGlzIGN1cnJlbnRseSBoaXJpbmcgZW5naW5lZXJzIHRoYXQgbG92ZSB0byB3b3JrIG9uIGRldmVsb3BlciBwcm9kdWN0cy4=\",\n        },\n      ],\n    },\n  });\n\n  console.log(result);\n}\n\nrun();"
      - lang: ruby
        label: PutAssessmentOrdersAssessmentOrderIdResult
        source: "require 'kombo'\n\nModels = ::Kombo::Models\ns = ::Kombo::Kombo.new(\n  integration_id: 'workday:HWUTwvyx2wLoSUHphiWVrp28',\n  security: Models::Shared::Security.new(\n    api_key: '<YOUR_BEARER_TOKEN_HERE>'\n  )\n)\nres = s.assessment.update_order_result(assessment_order_id: 'GRKdd9dibYKKCrmGRSMJf3wu', body: Models::Shared::PutAssessmentOrdersAssessmentOrderIdResultRequestBody.new(\n  status: Models::Shared::PutAssessmentOrdersAssessmentOrderIdResultRequestBodyStatus::COMPLETED,\n  result_url: 'https://example.com',\n  completed_at: DateTime.iso8601('2023-04-04T00:00:00Z'),\n  score: 90.0,\n  max_score: 100.0,\n  attributes: [\n    Models::Shared::AttributeText.new(\n      type: 'TEXT',\n      label: 'Role fit',\n      value: 'Excellent'\n    ),\n    Models::Shared::AttributeSubResult.new(\n      type: 'SUB_RESULT',\n      id: '<YOUR_INTERNAL_ID_OF_THE_TEST>',\n      label: 'Personality test',\n      score: Models::Shared::Score.new(\n        value: 97.0,\n        max: 100.0\n      ),\n      status: Models::Shared::AttributeStatus::COMPLETED\n    ),\n  ],\n  attachments: [\n    Models::Shared::PutAssessmentOrdersAssessmentOrderIdResultRequestBodyAttachment.new(\n      name: 'Assessment Report.pdf',\n      content_type: 'application/pdf',\n      data: 'SGkgdGhlcmUsIEtvbWJvIGlzIGN1cnJlbnRseSBoaXJpbmcgZW5naW5lZXJzIHRoYXQgbG92ZSB0byB3b3JrIG9uIGRldmVsb3BlciBwcm9kdWN0cy4='\n    ),\n  ]\n))\n\nunless res.put_assessment_orders_assessment_order_id_result_positive_response.nil?\n  # handle response\nend"
components:
  schemas:
    PutAssessmentOrdersAssessmentOrderIdResultParameterAssessmentOrderId:
      type: string
    PutAssessmentPackagesRequestBody:
      type: object
      properties:
        packages:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: A unique identifier for the assessment package.
              type:
                type: string
                enum:
                - BEHAVIORAL
                - VIDEO_INTERVIEW
                - SKILLS_TEST
                - BACKGROUND_CHECK
                - REFERENCE_CHECK
              name:
                type: string
                description: The name of the assessment package.
              description:
                type: string
                description: Description about the package. Some ATSs will display this in their UI.
            required:
            - id
            - type
            - name
            - description
      required:
      - packages
    GetAssessmentOrdersOpenParameterPageSize:
      type: integer
      format: int64
      minimum: 1
      maximum: 250
      default: 100
      description: The number of results to return per page. Maximum is 250.
    PutAssessmentOrdersAssessmentOrderIdResultPositiveResponse:
      type: object
      properties:
        status:
          type: string
          const: success
        data:
          type: object
        warnings:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
            required:
            - message
          description: These are the interaction warnings that are shown in the dashboard. They are meant to provide debug information to you. We recommend logging them to the console.
      required:
      - status
      - data
      - warnings
    GetAssessmentOrdersPositiveResponse:
      type: object
      properties:
        status:
          type: string
          const: success
        data:
          type: object
          properties:
            next:
              type:
              - string
              - 'null'
            results:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: The unique identifier of the assessment order.
                    examples:
                    - B5KQKhAgTv6ZwzrfAbqbhipd
                  package_id:
                    type: string
                    description: The identifier of the assessment package.
                    examples:
                    - typescript_test
                  status:
                    type: string
                    enum:
                    - OPEN
                    - COMPLETED
                    - CANCELLED
                    - REJECTED
                    description: The current status of the assessment order.
                    examples:
                    - OPEN
                  candidate:
                    type: object
                    properties:
                      remote_id:
                        type:
                        - string
                        - 'null'
                        description: The candidate's identifier in the integrated system.
                        examples:
                        - '12345'
                      email:
                        type: string
                        description: The candidate's email address.
                        examples:
                        - john.doe@gmail.com
                        format: email
                      first_name:
                        type:
                        - string
                        - 'null'
                        description: The candidate's first name.
                        examples:
                        - John
                      last_name:
                        type:
                        - string
                        - 'null'
                        description: The candidate's last name.
                        examples:
                        - Doe
                      phone:
                        type:
                        - string
                        - 'null'
                        description: The candidate's phone number.
                        examples:
                        - +1 123 456 7890
                    required:
                    - remote_id
                    - email
                    - first_name
                    - last_name
                    - phone
                    description: Information about the candidate taking the assessment.
                  application:
                    type: object
                    properties:
                      remote_id:
                        type:
                        - string
                        - 'null'
                        description: The application's identifier in the integrated system.
                        examples:
                        - '54321'
                    required:
                    - remote_id
                    description: Information about the job application.
                  job:
                    type: object
                    properties:
                      remote_id:
                        type:
                        - string
                        - 'null'
                        description: The job's identifier in the integrated system.
                        examples:
                        - '67890'
                      name:
                        type:
                        - string
                        - 'null'
                        description: The job title.
                        examples:
                        - Bottle Opener
                      job_code:
                        type:
                        - string
                        - 'null'
                        description: The human readable job code. Some systems expose this as the Requisition Code/ID.
                        examples:
                        - BO-2024-01
                      description:
                        type:
                        - string
                        - 'null'
                        description: Description of the job. This field is usually returned as HTML.
                        examples:
