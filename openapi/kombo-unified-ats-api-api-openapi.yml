  /ats/import-tracked-application:
    post:
      operationId: PostAtsImportTrackedApplication
      summary: Import tracked application
      description: "Import tracked application\n\nRetroactively import existing applications into Kombo's tracking system. This is particularly useful if you have enabled the 'sync only created applications' setting and want to start tracking applications that were created before using Kombo.\n\nTo import an application, you'll need to provide specific identifiers based on the ATS. The available `id_type` values are defined by Kombo based on the tool's API capabilities. Please reach out to Kombo support if you require further types to be supported.\n\nOnce imported, Kombo will automatically fetch and update the application's complete data during the next sync.\n\n### Example Request Body\n\n```json\n{\n  \"tracked_at\": \"2024-04-12T14:33:47.000Z\",\n  \"successfactors\": {\n    \"id_type\": \"application_remote_id\",\n    \"application_remote_id\": \"1224042\"\n  }\n}\n```"
      tags:
      - Unified ATS API
      parameters:
      - in: header
        name: X-Integration-Id
        schema:
          type: string
        description: ID of the integration you want to interact with.
        example: join:HWUTwvyx2wLoSUHphiWVrp28
        required: true
      requestBody:
        description: POST /ats/import-tracked-application Request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostAtsImportTrackedApplicationRequestBody'
            examples:
              example1:
                value:
                  tracked_at: '2024-04-12T14:33:47.000Z'
                  successfactors:
                    id_type: application_remote_id
                    application_remote_id: '1224042'
      responses:
        '200':
          description: POST /ats/import-tracked-application Positive response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostAtsImportTrackedApplicationPositiveResponse'
              examples:
                example1:
                  value:
                    status: success
                    data:
                      id: 5wdtQtJei2oVhJKya2V1KZLM
                      tracked_at: '2025-02-11T15:37:37.000Z'
                      imported_id:
                        successfactors:
                          id_type: application_remote_id
                          application_remote_id: '1224042'
                    warnings:
                    - message: This is an example warning!
        default:
          $ref: '#/components/responses/ErrorResponseATS'
