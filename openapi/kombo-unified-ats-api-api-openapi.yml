        You''d like to see this feature for another integration? Please reach out!

        We''re always happy to discuss extending our coverage.


        This can, for example, be used to link a candidate back to a test result/assessment in your application. As not all ATS tools have a "result link" feature, we sometimes repurpose other fields to expose it.


        This endpoint requires the permission **Add result links** to be enabled in your scope config.


        ### Example Request Body


        ```json

        {

        "application_id": "8Xi6iZrwusZqJmDGXs49GBmJ",

        "label": "Assessment Result",

        "url": "https://example.com/test-results/5BtP1WC1UboS7CF3yxjKcvjG",

        "details": {

        "custom_field_name_prefix": "Acme:",

        "attributes": [

        {

        "key": "Score",

        "value": "100%"

        },

        {

        "key": "Time",

        "value": "2:30h"

        }

        ]

        },

        "remote_fields": {}

        }

        ```'
      tags:
      - Unified ATS API
      parameters:
      - in: header
        name: X-Integration-Id
        schema:
          type: string
        description: ID of the integration you want to interact with.
        example: join:HWUTwvyx2wLoSUHphiWVrp28
        required: true
      - name: application_id
        in: path
        required: true
        description: The Kombo ID of the application you want to create the link for.
        schema:
          $ref: '#/components/schemas/PostAtsApplicationsApplicationIdResultLinksParameterApplicationId'
        examples:
          example1:
            value: 8Xi6iZrwusZqJmDGXs49GBmJ
      requestBody:
        description: POST /ats/applications/:application_id/result-links Request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostAtsApplicationsApplicationIdResultLinksRequestBody'
            examples:
              example1:
                value:
                  label: Assessment Result
                  url: https://example.com/test-results/5BtP1WC1UboS7CF3yxjKcvjG
                  details:
                    custom_field_name_prefix: 'Acme:'
                    attributes:
                    - key: Score
                      value: 100%
                    - key: Time
                      value: 2:30h
      responses:
        '200':
          description: POST /ats/applications/:application_id/result-links Positive response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostAtsApplicationsApplicationIdResultLinksPositiveResponse'
              examples:
                example1:
                  value:
                    status: success
                    data: {}
                    warnings:
                    - message: This is an example warning!
        default:
          $ref: '#/components/responses/ErrorResponseATS'
      x-codeSamples:
      - lang: python
        label: PostAtsApplicationsApplicationIdResultLinks
        source: "from kombo import Kombo\n\n\nwith Kombo(\n    integration_id=\"workday:HWUTwvyx2wLoSUHphiWVrp28\",\n    api_key=\"<YOUR_BEARER_TOKEN_HERE>\",\n) as k_client:\n\n    res = k_client.ats.add_application_result_link(application_id=\"8Xi6iZrwusZqJmDGXs49GBmJ\", label=\"Assessment Result\", url=\"https://example.com/test-results/5BtP1WC1UboS7CF3yxjKcvjG\", details={\n        \"custom_field_name_prefix\": \"Acme:\",\n        \"attributes\": [\n            {\n                \"key\": \"Score\",\n                \"value\": \"100%\",\n            },\n            {\n                \"key\": \"Time\",\n                \"value\": \"2:30h\",\n            },\n        ],\n    })\n\n    # Handle response\n    print(res)"
      - lang: typescript
        label: PostAtsApplicationsApplicationIdResultLinks
        source: "import { Kombo } from \"@kombo-api/sdk\";\n\nconst kombo = new Kombo({\n  integration_id: \"workday:HWUTwvyx2wLoSUHphiWVrp28\",\n  api_key: \"<YOUR_BEARER_TOKEN_HERE>\",\n});\n\nasync function run() {\n  const result = await kombo.ats.addApplicationResultLink({\n    application_id: \"8Xi6iZrwusZqJmDGXs49GBmJ\",\n    body: {\n      label: \"Assessment Result\",\n      url: \"https://example.com/test-results/5BtP1WC1UboS7CF3yxjKcvjG\",\n      details: {\n        custom_field_name_prefix: \"Acme:\",\n        attributes: [\n          {\n            key: \"Score\",\n            value: \"100%\",\n          },\n          {\n            key: \"Time\",\n            value: \"2:30h\",\n          },\n        ],\n      },\n    },\n  });\n\n  console.log(result);\n}\n\nrun();"
      - lang: ruby
        label: PostAtsApplicationsApplicationIdResultLinks
        source: "require 'kombo'\n\nModels = ::Kombo::Models\ns = ::Kombo::Kombo.new(\n  integration_id: 'workday:HWUTwvyx2wLoSUHphiWVrp28',\n  security: Models::Shared::Security.new(\n    api_key: '<YOUR_BEARER_TOKEN_HERE>'\n  )\n)\nres = s.ats.add_application_result_link(application_id: '8Xi6iZrwusZqJmDGXs49GBmJ', body: Models::Shared::PostAtsApplicationsApplicationIdResultLinksRequestBody.new(\n  label: 'Assessment Result',\n  url: 'https://example.com/test-results/5BtP1WC1UboS7CF3yxjKcvjG',\n  details: Models::Shared::PostAtsApplicationsApplicationIdResultLinksRequestBodyDetails.new(\n    custom_field_name_prefix: 'Acme:',\n    attributes: [\n      Models::Shared::PostAtsApplicationsApplicationIdResultLinksRequestBodyAttribute.new(\n        key: 'Score',\n        value: '100%'\n      ),\n      Models::Shared::PostAtsApplicationsApplicationIdResultLinksRequestBodyAttribute.new(\n        key: 'Time',\n        value: '2:30h'\n      ),\n    ]\n  )\n))\n\nunless res.post_ats_applications_application_id_result_links_positive_response.nil?\n  # handle response\nend"
