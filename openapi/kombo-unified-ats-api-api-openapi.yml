      x-codeSamples:
      - lang: python
        label: GetAtsApplications
        source: "from kombo import Kombo\n\n\nwith Kombo(\n    integration_id=\"workday:HWUTwvyx2wLoSUHphiWVrp28\",\n    api_key=\"<YOUR_BEARER_TOKEN_HERE>\",\n) as k_client:\n\n    res = k_client.ats.get_applications(page_size=100, include_deleted=False, ignore_unsupported_filters=False)\n\n    while res is not None:\n        # Handle items\n\n        res = res.next()"
      - lang: typescript
        label: GetAtsApplications
        source: "import { Kombo } from \"@kombo-api/sdk\";\n\nconst kombo = new Kombo({\n  integration_id: \"workday:HWUTwvyx2wLoSUHphiWVrp28\",\n  api_key: \"<YOUR_BEARER_TOKEN_HERE>\",\n});\n\nasync function run() {\n  const result = await kombo.ats.getApplications({});\n\n  for await (const page of result) {\n    console.log(page);\n  }\n}\n\nrun();"
