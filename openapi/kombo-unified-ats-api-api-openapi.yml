            type: object
            properties:
              question_id:
                type: string
                description: ID of the question returned by the Kombo API. We'll report a warning in the logs if the question can't be found on the job.
              answer:
                anyOf:
                - type: string
                  description: Answer to a `TEXT` question or the option ID of the answer to a `SINGLE_SELECT` question.
                - type: boolean
                  description: Answer to a `BOOLEAN` question.
