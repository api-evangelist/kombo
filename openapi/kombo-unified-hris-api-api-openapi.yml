                      - label
                    description: An array of selected passthrough integration fields. [Read more](/integration-fields)
                    examples:
                    - - id: 5NVFhMpB9Ah6by44tzNjZLyE
                        key: firstName
                        type: DEFAULT
                        value: Frank
                        label: First Name
                      - id: 8nuajYpoRd5GnxEQaaWKUDYQ
                        key: customTshirtSize
