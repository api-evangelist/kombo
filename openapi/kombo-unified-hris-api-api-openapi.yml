            ordered_levels:
            - Proficiency Level 1
            - Proficiency Level 2
            - Proficiency Level 3
            - Proficiency Level 4
            - Proficiency Level 5
            changed_at: '2022-08-07T14:01:29.196Z'
            remote_deleted_at: null
            remote_data: null
