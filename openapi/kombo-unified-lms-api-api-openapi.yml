        For this endpoint, `updated_after` matches when the returned record changed, or when related data changed as described below.


        | Path | Added/Removed | Linked Record |

        | --- | --- | --- |

        | `user` | ✗ No | ✗ No |

        | `course_revision` | ✗ No | ✗ No |


